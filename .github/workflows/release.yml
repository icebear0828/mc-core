name: Build and Release Mods

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0-preview'

permissions:
  contents: write

jobs:
  package-tests:
    name: Packaging tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run packaging tests
        run: uv run --with pytest pytest -q tests/test_package_mod.py

  eldenring:
    name: Elden Ring (${{ matrix.mode }})
    needs: package-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: mc
            flags: "-DENABLE_MC_MODE=ON -DENABLE_CS2_VIEWMODEL=OFF -DENABLE_OW_VIEWMODEL=OFF"
          - mode: cs
            flags: "-DENABLE_MC_MODE=OFF -DENABLE_CS2_VIEWMODEL=ON -DENABLE_OW_VIEWMODEL=OFF"
          - mode: ow
            flags: "-DENABLE_MC_MODE=OFF -DENABLE_CS2_VIEWMODEL=OFF -DENABLE_OW_VIEWMODEL=ON"
          - mode: all
            flags: "-DENABLE_MC_MODE=ON -DENABLE_CS2_VIEWMODEL=ON -DENABLE_OW_VIEWMODEL=ON"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure CMake (${{ matrix.mode }})
        run: cmake -B build-${{ matrix.mode }} -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF ${{ matrix.flags }}

      - name: Build Elden Ring adapter (${{ matrix.mode }})
        run: cmake --build build-${{ matrix.mode }} --config Release --target eldenring_adapter

      - name: Package Elden Ring (${{ matrix.mode }})
        shell: pwsh
        run: |
          $raw_tag = "${{ inputs.tag_name }}"
          if (-not $raw_tag) { $raw_tag = $env:GITHUB_REF_NAME }
          $version = $raw_tag.TrimStart('v')
          if (-not $version) { $version = "0.1.0" }
          Write-Host "Packaging Elden Ring ${{ matrix.mode }} version: $version"
          uv run python tools/package_mod.py --game eldenring `
            --build-dir build-${{ matrix.mode }}/bin/eldenring `
            --version $version --channel nexus --modes ${{ matrix.mode }} --out-dir dist

      - name: Upload Elden Ring package (${{ matrix.mode }})
        uses: actions/upload-artifact@v4
        with:
          name: eldenring-${{ matrix.mode }}
          path: dist/*.zip
          if-no-files-found: error

  other-adapters:
    name: Sekiro and Wukong
    needs: package-tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure CMake
        run: cmake -B build-win -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build other adapters (Release)
        run: |
          cmake --build build-win --config Release --target sekiro_adapter
          cmake --build build-win --config Release --target wukong_adapter

      - name: Package other adapters
        shell: pwsh
        run: |
          $raw_tag = "${{ inputs.tag_name }}"
          if (-not $raw_tag) { $raw_tag = $env:GITHUB_REF_NAME }
          $version = $raw_tag.TrimStart('v')
          if (-not $version) { $version = "0.1.0" }
          Write-Host "Packaging other adapters version: $version"

          uv run python tools/package_mod.py --game sekiro --build-dir build-win/bin/Release --version $version --channel nexus --out-dir dist
          uv run python tools/package_mod.py --game wukong --build-dir build-win/bin/Release --version $version --channel nexus --out-dir dist

      - name: Upload other adapter packages
        uses: actions/upload-artifact@v4
        with:
          name: other-adapters
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [eldenring, other-adapters]
    runs-on: windows-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Generate Aggregated Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Out-File -FilePath dist/SHA256SUMS_ALL.txt -Encoding utf8
          Get-Content dist/SHA256SUMS_ALL.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag_name }}"
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          if (-not $tag) { $tag = "v0.1.0-preview" }

          $notes = @"
          Automated release build of mc-core adapters.

          Elden Ring variants:
          - mc: Minecraft gameplay only
          - cs: Counter-Strike 2 arsenal/viewmodel only
          - ow: Overwatch Doomfist viewmodel only
          - mc_cs_ow: all three modes in one DLL

          Sekiro and Black Myth: Wukong adapters are included.

          **Offline / EULA compliant nexus distribution packages.**
          CS/OW viewmodel assets are game-derived and are not bundled; see the mode note in each package.
          "@

          $zips = @(Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName })
          gh release create $tag @zips dist/SHA256SUMS_ALL.txt `
            --title "mc-core $tag - Game Adapters Release" `
            --notes $notes
